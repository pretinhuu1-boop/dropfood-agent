<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Grotesk:wght@700&amp;display=swap');
      .display { font-family: 'Archivo Black', 'Arial Black', 'Arial', sans-serif; font-weight: 400; }
      .label { font-family: 'Space Grotesk', 'Arial', sans-serif; }
    </style>
  </defs>

  <!-- fundo cream: DROPFOOD wordmark horizontal, D em caixa + DROPFOOD + sublinha AGENT -->
  <rect width="720" height="200" fill="#FDF9F0"/>

  <!-- sombra dura diagonal (deslocamento 4px, sem blur) -->
  <rect x="28" y="44" width="120" height="120" rx="18" fill="#111111"/>

  <!-- D em caixa (tile pink de acao) -->
  <rect x="24" y="40" width="120" height="120" rx="18" fill="#FF3D81" stroke="#111111" stroke-width="2"/>
  <text x="84" y="102" text-anchor="middle" dominant-baseline="central" class="display" font-size="88" fill="#FDF9F0">D</text>

  <!-- DROPFOOD: DROP ink + FOOD pink (tracking -2px, mesmo do display da identidade) -->
  <text x="160" y="124" class="display" font-size="68" letter-spacing="-2">
    <tspan fill="#111111">DROP</tspan><tspan fill="#FF3D81">FOOD</tspan>
  </text>

  <!-- sublinha AGENT: label Space Grotesk 700 + barra pink -->
  <text x="160" y="152" class="label" font-size="18" font-weight="700" letter-spacing="5" fill="#111111">AGENT</text>
  <rect x="160" y="158" width="176" height="8" rx="8" fill="#FF3D81"/>
</svg>

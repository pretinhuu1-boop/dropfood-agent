# DROPFOOD skin — identidade do produto.
# Paleta canônica = design system do dashboard da loja (neubrutal.css):
# cream #FDF9F0 · ink #111 · pink #FF3D81 · mint #3DDC97 · canary #FFD23F ·
# lilac #C8A2FF · coral #FF6B5E — decisão do dono 25/10.
# Cobre CLI + TUI + Desktop de uma vez. Reverter: hermes config set display.skin default

name: dropfood
description: DROPFOOD — cream, pink e mint neubrutal (cara do dashboard da loja)

colors:
  # Base surface — cream (mesma do dashboard).
  background: "#FDF9F0"

  # Brand accent — pink (ação, tab ativa, botões).
  ui_accent: "#FF3D81"
  banner_accent: "#FF3D81"

  # Text hierarchy — ink sobre cream (contraste chapado).
  banner_title: "#111111"
  banner_text: "#111111"
  ui_text: "#111111"
  ui_label: "#8F897E"
  banner_dim: "#8F897E"
  # Borders — NEUBRUTAL: moldura marcada em ink (2px, sombra dura).
  banner_border: "#111111"
  ui_border: "#111111"

  # Semantic status — mint / canary / coral.
  ui_ok: "#3DDC97"
  ui_warn: "#FFD23F"
  ui_error: "#FF6B5E"
  ui_tool: "#FF3D81"        # marcador ● de tool-call
  ui_thinking: "#6B655C"    # texto de raciocínio

  # CLI / TUI chrome — NEUBRUTAL: chão ink, moldura dupla.
  prompt: "#FF3D81"
  input_rule: "#111111"
  response_border: "#111111"
  status_bar_bg: "#111111"
  status_bar_text: "#FDF9F0"
  status_bar_strong: "#FF3D81"
  status_bar_dim: "#A8A294"
  status_bar_good: "#3DDC97"
  status_bar_warn: "#FFD23F"
  status_bar_bad: "#FF6B5E"
  status_bar_critical: "#FF6B5E"
  session_label: "#FF3D81"
  session_border: "#111111"

  # Menus / seleção — cream com item ativo pink.
  completion_menu_bg: "#FFFDF7"
  completion_menu_current_bg: "#FF3D81"
  selection_bg: "#FF3D81"
  shell_dollar: "#3DDC97"
  voice_status_bg: "#111111"

  # Diff — mint / coral.
  diff_added: "#0E9F6E"
  diff_removed: "#FF6B5E"
  diff_added_word: "#12B981"
  diff_removed_word: "#FF8A80"

  # Syntax — leve ajuste quente.
  syntax_string: "#FF3D81"
  syntax_number: "#0E9F6E"
  syntax_keyword: "#C2410C"
  syntax_comment: "#8F897E"

# Flavor — identidade do produto.
branding:
  agent_name: DROPFOOD
  prompt_symbol: "▸"
  welcome: "DROPFOOD — sua loja, sua regra."
  goodbye: "Até a próxima — o radar segue de olho."
  help_header: "DROPFOOD — comandos"

tool_prefix: "▹"
